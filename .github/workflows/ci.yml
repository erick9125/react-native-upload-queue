name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Coverage, not plain test: vitest.config.ts declares 90% thresholds and
      # `npm run test` does not enforce them, so they never actually gated CI.
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run verify:package
      - run: npm audit --audit-level=high
